<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14100e" />
    <title>週刊サバイブ</title>
    <meta name="description" content="週刊連載を持つ漫画家となり、毎週「今週の話」をカードの組み合わせで作るデッキ構築型スコアアタック。読者アンケートのノルマを超え続け、全25話の最終回まで生き残れ。" />

    <!--
      リンクを貼ったときのカード表示（v1.0）。

      なおこのタグ自体はページ読み込み時に通信を発生させないため、
      単一HTMLをローカルで開く配布形態のままでも問題ない
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="週刊サバイブ" />
    <meta property="og:title" content="週刊サバイブ" />
    <meta property="og:description" content="きみの連載は、何話まで生き残れるか。週刊連載の漫画家になって全25話を描ききるデッキ構築型スコアアタック。" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="週刊サバイブ" />
    <meta name="twitter:description" content="きみの連載は、何話まで生き残れるか。週刊連載の漫画家になって全25話を描ききるデッキ構築型スコアアタック。" />
