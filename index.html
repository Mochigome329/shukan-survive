    <!--

      ogp.png は public/ 直下に置き、vite が dist/ にそのままコピーする。
      deploy.yml 側もこのファイルを _site/ にコピーするよう対応済み
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="週刊サバイブ" />
    <meta property="og:title" content="週刊サバイブ" />

    <meta property="og:url" content="https://mochigome329.github.io/shukan-survive/" />
    <meta property="og:image" content="https://mochigome329.github.io/shukan-survive/ogp.png" />
    <meta property="og:image:width" content="1731" />
    <meta property="og:image:height" content="909" />

    <meta name="twitter:image" content="https://mochigome329.github.io/shukan-survive/ogp.png" />
