name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # 単一HTML（dist/uchikiri.html）を index.html として配信する。
      # og:image が絶対URLで参照する ogp.png（public/ 直下、vite が dist/ にそのままコピー）も
      # 単一HTML化の対象外なので別途コピーする（v7.32）
      - run: |
          mkdir -p _site
          cp dist/uchikiri.html _site/index.html
          cp dist/ogp.png _site/ogp.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
